[package]
name = "wajex"
version = "0.1.0"
description = "Wajex — مترجم هوشمند"
authors = ["Parham"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wajex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
